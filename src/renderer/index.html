<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src *; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
  <title>Cizi Code</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <section id="login-view" class="view login-view">
    <div class="login-card">
      <div class="brand">
        <img class="brand-mark" src="../../assets/logo.png" alt="" />
        <div>
          <h1>Cizi Code</h1>
          <p class="muted">Kodlama araçlarınızı tek anahtarla bağlayın</p>
        </div>
      </div>
      <label for="login-key">API Anahtarı</label>
      <input id="login-key" data-cli-id="login-key" type="password" placeholder="sk-cizi-..." autocomplete="off" />
      <button id="login-btn" data-cli-id="login-btn" class="primary block">Giriş Yap</button>
      <p id="login-error" class="error hidden"></p>
      <p class="muted tiny">Cizi Code hesabınızla giriş yapılır.</p>
    </div>
  </section>

  <section id="dash-view" class="view hidden">
    <header class="topbar">
      <div class="brand compact">
        <img class="brand-mark" src="../../assets/logo.png" alt="" />
        <span class="brand-name">Cizi Code</span>
      </div>
      <span id="conn-base" class="gateway-chip">Cizi Code Cloud</span>

      <div class="topbar-spacer"></div>

      <!-- Kalan kullanım artık dikey yer kaplayan bir halka değil: ekranın asıl
           konusu bağlantı kartları, kullanım ise tek bakışta okunan bir şerit. -->
      <div class="meter" id="quota-meter" title="Kalan kullanım hakkınız">
        <span class="meter-label">Kalan</span>
        <span class="meter-track"><span id="quota-fill" class="meter-fill"></span></span>
        <span id="quota-pct" class="meter-value">--%</span>
      </div>

      <button id="usage-refresh" data-cli-id="usage-refresh" class="ghost icon-btn" title="Hesap ve kullanım bilgilerini yenile">Yenile</button>
      <button id="update-check" data-cli-id="update-check" class="ghost icon-btn" title="Cizi Code güncellemesi var mı">Güncelleme</button>
      <button id="logout-btn" data-cli-id="logout-btn" class="ghost icon-btn">Çıkış</button>
    </header>

    <div id="update-banner" class="banner hidden">
      <span id="update-message"></span>
      <button id="update-install" data-cli-id="update-install" class="primary tiny-btn hidden">Yeniden Başlat ve Kur</button>
    </div>

    <p id="limit-msg" class="banner bad hidden"></p>

    <main class="content">
      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>Bağlantılar</h2>
            <p class="panel-note" id="tools-note">Anahtarı açtığınızda ayarlarınızın yedeği alınır; kapattığınızda birebir geri yüklenir.</p>
          </div>
          <button id="tool-reconcile-all" data-cli-id="tool.reconcile-all" data-cli-await="long" data-cli-await-timeout="120000" class="ghost tiny-btn" title="Her bağlantıyı gerçek ayar dosyalarıyla karşılaştırır ve eksikleri tamamlar">Bağlantıları doğrula</button>
        </div>
        <div id="tools-list" class="cards"></div>
      </section>

      <section class="panel split-panel">
        <div class="subpanel">
          <div class="panel-head tight">
            <h3>Kullanılabilir Modeller</h3>
          </div>
          <div id="model-chips" class="chips"></div>
        </div>

        <div class="subpanel">
          <div class="panel-head tight">
            <h3>Kullanım Eğilimi</h3>
            <select id="period-select" data-cli-id="period-select" class="select" aria-label="Dönem">
              <option value="today">Bugün</option>
              <option value="7d">7 Gün</option>
              <option value="30d" selected>30 Gün</option>
              <option value="60d">60 Gün</option>
            </select>
          </div>
          <canvas id="usage-chart" height="150"></canvas>
          <p class="muted tiny" id="usage-updated">Henüz yenilenmedi</p>
        </div>
      </section>
    </main>
  </section>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <script src="cliUi.js"></script>
  <script src="modelFamilies.js"></script>
  <script src="modelCapabilities.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
